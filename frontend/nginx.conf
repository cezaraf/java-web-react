server {
    listen 80;
    root /usr/share/nginx/html;

    # SPA: rotas do react-router (/grupos, /exames/1/editar...) caem no index.html.
    location / {
        try_files $uri /index.html;
    }

    # Assets com hash no nome podem ser cacheados indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
